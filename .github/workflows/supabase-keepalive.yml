# Free Supabase projects pause after 7 days without activity, and paused projects stop serving
# the app's photos. This job reads one row every 3 days so the project always counts as active.
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

permissions:
  actions: write

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      # Publishable key: the same one shipped inside the app, safe to keep here.
      SUPABASE_URL: https://rqndcsdrrtibwpzabuqu.supabase.co
      SUPABASE_KEY: sb_publishable_oPX0z_P39yzyUuPu3p3RgQ_Boh0YcOH
    steps:
      - name: Query the database
        run: |
          curl --fail --silent --show-error \
            "$SUPABASE_URL/rest/v1/keepalive?select=id" \
            -H "apikey: $SUPABASE_KEY"

      # GitHub turns off scheduled workflows after 60 days with no commits. Re-enabling the
      # workflow from inside itself resets that timer, so the job keeps running on a quiet repo.
      - name: Keep this schedule enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/supabase-keepalive.yml/enable"
